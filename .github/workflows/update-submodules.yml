name: Update Submodules

on:
  # Déclenché manuellement
  workflow_dispatch:

  # Déclenché quand un submodule est pushé
  repository_dispatch:
    types: [submodule-update]

jobs:
  update-submodules:
    runs-on: ubuntu-latest

    steps:
      - name: Log trigger info
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Triggered by service: ${{ github.event.client_payload.service }}"
          echo "Ref: ${{ github.event.client_payload.ref }}"
          echo "SHA: ${{ github.event.client_payload.sha }}"

      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PAT_WORKFLOW_TRIGGER || secrets.GITHUB_TOKEN }}

      - name: Update submodules to latest commit
        run: |
          git submodule update --remote --merge

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✅ No submodule updates needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📦 Submodules updated:"
            git diff --name-only
          fi

      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            COMMIT_MSG="REFACTOR-[repo-parent] : sync ${{ github.event.client_payload.service }} submodule"
          else
            COMMIT_MSG="REFACTOR-[repo-parent] : sync all submodules"
          fi

          git commit -m "$COMMIT_MSG"
          git push

      - name: Summary
        run: |
          echo "### 📦 Submodules Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Submodules synchronized successfully!" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No updates needed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git submodule status >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
