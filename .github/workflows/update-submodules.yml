name: Update Submodules

on:
  # Déclenché manuellement
  workflow_dispatch:
  
  # Déclenché quotidiennement à 2h du matin
  schedule:
    - cron: '0 2 * * *'
  
  # Déclenché quand un submodule est pushé
  repository_dispatch:
    types: [submodule-update]

jobs:
  update-submodules:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Update submodules to latest commit
        run: |
          git submodule update --remote --merge
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No submodule updates"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Submodules updated:"
            git diff --name-only
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "REFACTOR-[repo-parent] : auto-update submodules to latest commits"
          git push
      
      - name: Summary
        run: |
          echo "### Submodules Status 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          git submodule status >> $GITHUB_STEP_SUMMARY

