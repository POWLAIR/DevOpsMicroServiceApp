apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-deployment
  namespace: microservices
  labels:
    app: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: powlker/product-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: DB_NAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: REDIS_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: JWT_ALGORITHM
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: HOST
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: NODE_ENV
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: CORS_ORIGINS
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: AUTH_SERVICE_URL
            - name: FAKESTORE_API_URL
              valueFrom:
                configMapKeyRef:
                  name: product-config
                  key: FAKESTORE_API_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
