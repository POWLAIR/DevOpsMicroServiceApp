apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker-deployment
  namespace: microservices
  labels:
    app: notification-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
        - name: notification-worker
          image: powlker/notification-service:latest
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.workers.celery_app
            - worker
            - --loglevel=info
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://saas_admin:$(DB_PASSWORD)@postgres:5432/saas_platform"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: CELERY_RESULT_BACKEND
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SENDGRID_API_KEY
                  optional: true
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SENDGRID_FROM_EMAIL
                  optional: true
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_PHONE_NUMBER
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"

