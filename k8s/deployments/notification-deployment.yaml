apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
  namespace: microservices
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: powlker/notification-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 6000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: PORT
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://saas_admin:$(DB_PASSWORD)@postgres:5432/saas_platform"
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: REDIS_URL
            - name: CELERY_BROKER_URL
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: CELERY_BROKER_URL
            - name: CELERY_RESULT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: CELERY_RESULT_BACKEND
            - name: SENDGRID_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SENDGRID_API_KEY
                  optional: true
            - name: SENDGRID_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: SENDGRID_FROM_EMAIL
                  optional: true
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_ACCOUNT_SID
                  optional: true
            - name: TWILIO_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_AUTH_TOKEN
                  optional: true
            - name: TWILIO_PHONE_NUMBER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: TWILIO_PHONE_NUMBER
                  optional: true
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: notification-config
                  key: CORS_ORIGINS
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 40
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 6000
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

