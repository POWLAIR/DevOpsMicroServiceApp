apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: microservices
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: order-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_PATH
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: DATABASE_PATH
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: JWT_SECRET
        - name: JWT_ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: JWT_ALGORITHM
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: PORT
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: HOST
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: NODE_ENV
        - name: CORS_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: CORS_ORIGINS
        - name: AUTH_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: order-config
              key: AUTH_SERVICE_URL
        volumeMounts:
        - name: order-storage
          mountPath: /app/data
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 40
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: order-storage
        persistentVolumeClaim:
          claimName: order-pvc

