apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-deployment
  namespace: microservices
  labels:
    app: tenant-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
    spec:
      containers:
        - name: tenant-service
          image: powlker/tenant-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://saas_admin:$(DB_PASSWORD)@postgres:5432/saas_platform"
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tenant-config
                  key: PORT
            - name: HOST
              valueFrom:
                configMapKeyRef:
                  name: tenant-config
                  key: HOST
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: tenant-config
                  key: JWT_ALGORITHM
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: payment-secret
                  key: STRIPE_WEBHOOK_SECRET
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: tenant-config
                  key: CORS_ORIGINS
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

